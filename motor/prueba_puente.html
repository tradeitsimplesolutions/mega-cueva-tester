<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del puente</title>
<style>
  :root { --bg: #0d1117; --ink: #e6edf3; --dim: #8b949e; --ok: #3fb950; --ko: #f85149; --line: #30363d; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 16px; }
  .fila { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .barra { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; flex: 1 1 200px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  #etapa { min-width: 260px; }
  .t { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .t b { display: block; font-size: 18px; }
  .t span { color: var(--dim); font-size: 12px; }
  .ok { color: var(--ok); } .ko { color: var(--ko); }
  pre { background: #161b22; border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; max-height: 60vh; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Prueba del puente MCT_MOTOR</h1>
  <p>Abre con doble clic (file://). Sube <code>datos/XAUUSD_D1_ejemplo.csv</code>; la spec es la del oro en formato de la app (README).</p>
  <div class="fila">
    <input type="file" id="csv" accept=".csv,.txt">
    <button id="correr">Correr</button>
    <span id="etapa">—</span>
    <div class="barra"><i id="pct"></i></div>
  </div>
  <div class="fila">
    <div class="t"><b id="t_ini">—</b><span>cargar motor</span></div>
    <div class="t"><b id="t_run">—</b><span>correr 5 fases</span></div>
    <div class="t"><b id="t_ops">—</b><span>operaciones IS / OOS</span></div>
    <div class="t"><b id="t_pf">—</b><span>PF IS / OOS</span></div>
  </div>
  <div id="veredicto"></div>
  <pre id="salida"></pre>
</main>
<script src="../app/motor_puente.js"></script>
<script>
const SPEC_APP = {
  version: 1, nombre: 'Oro RSI(4) 25/55',
  activo: { simbolo: 'XAUUSD', clase: 'metal' }, temporalidad: 'D1', direccion: 'largo',
  datos: { fuente: 'darwinex_mt5', desde: '1998-04-22', hasta: '2026-10-02', zona_horaria: 'servidor_gmt3_usdst' },
  reglas: {
    filtros: [{ izq: { tipo: 'precio' }, op: '>', der: { tipo: 'sma', periodo: 200 } }],
    entrada: [{ izq: { tipo: 'rsi', periodo: 4 }, op: '<', der: { tipo: 'num', valor: 25 } }],
    salida: [{ izq: { tipo: 'rsi', periodo: 4 }, op: '>', der: { tipo: 'num', valor: 55 } }] },
  ejecucion: { momento: 'apertura_siguiente', orden: 'mercado' },
  gestion: { stop: { tipo: 'ninguno', valor: null }, objetivo: { tipo: 'ninguno', valor: null }, salida_tiempo_velas: null },
  sizing: { tipo: 'pct_capital', valor: 100 },
  costes: { perfil: 'darwinex_mt5', spread_pb: 1.03, comision_pb_lado: 0.01, deslizamiento_pb_lado: 3, swap_largo_pct_anual: -5.39, swap_corto_pct_anual: 3.07 },
  corte: { tipo: 'fecha', fecha: '2018-03-08', is_pct: 70, fecha_efectiva: '2018-03-08' }
};
const $ = (id) => document.getElementById(id);
const seg = (ms) => (ms / 1000).toFixed(2) + ' s';
window.__etapas = [];
MCT_MOTOR.progreso = (etapa, pct) => {
  window.__etapas.push([etapa, pct, Math.round(performance.now())]);
  $('etapa').textContent = etapa + ' · ' + pct + ' %';
  $('pct').style.width = pct + '%';
};
// precarga al abrir (en la app: al entrar en «Prueba inicial»)
const t0 = performance.now();
MCT_MOTOR.iniciar().then(() => { window.__ms_iniciar = performance.now() - t0; $('t_ini').textContent = seg(window.__ms_iniciar) + ' · ' + MCT_MOTOR.modo; })
  .catch((e) => { $('veredicto').innerHTML = '<span class="ko">' + e.message + '</span>'; });

$('correr').onclick = async () => {
  const f = $('csv').files[0];
  $('correr').disabled = true;
  const t = performance.now();
  const res = await MCT_MOTOR.correr(SPEC_APP, f || '');
  window.__ms_correr = performance.now() - t;
  window.__resultado = res;
  $('t_run').textContent = seg(window.__ms_correr);
  if (res.error) {
    $('veredicto').innerHTML = '<span class="ko">' + res.error + '</span>';
  } else {
    const f1 = res.f1;
    $('t_ops').textContent = f1.IS.n + ' / ' + f1.OOS.n;
    $('t_pf').textContent = f1.IS.pf.toFixed(2) + ' / ' + f1.OOS.pf.toFixed(2);
    $('veredicto').innerHTML = '<span class="' + (res.verdict.startsWith('PASA') ? 'ok' : 'ko') + '">' + res.verdict + '</span>';
    const corto = { ...res, eq: `[${res.eq.length} puntos]`, dd: `[${res.dd.length}]`, velas: `[${res.velas.length}]`,
      velas_full: `[${res.velas_full.length} velas]`, trades: [res.trades[0], `… ${res.trades.length} operaciones`],
      fases_detalle: '[…]', meseta: res.meseta, spec_app: '[…]' };
    $('salida').textContent = JSON.stringify(corto, null, 2);
  }
  $('correr').disabled = false;
};
</script>
</body>
</html>
